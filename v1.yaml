openapi: 3.1.1
info:
  title: Api | v1
  version: 1.0.0
servers:
  - url: http://localhost:5134/
paths:
  /api/trips/Bookings:
    get:
      tags:
        - Bookings
      description: >-
        **Authorization** (all must pass):

        - `ViewBookings`: one of `tenantAdmin`, `admin`, `bookingsViewer`,
        `bookingsManager`
      parameters:
        - name: Status
          in: query
          description: "Only list bookings in this status: 0 = Pending, 1 = Confirmed, 2 =
            Cancelled."
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: Page
          in: query
          description: One-based page number.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          description: Number of bookings per page, at most 100.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PaginatedOfBookingListItemResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOfBookingListItemResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/PaginatedOfBookingListItemResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
  /api/trips/trips/{tripId}/bookings:
    get:
      tags:
        - TripBookings
      description: >-
        **Authorization** (all must pass):

        - `TenantMember`

        - `ViewBookings`: one of `tenantAdmin`, `admin`, `bookingsViewer`,
        `bookingsManager`
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Status
          in: query
          description: "Only list bookings in this status: 0 = Pending, 1 = Confirmed, 2 =
            Cancelled."
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: Page
