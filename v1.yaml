      description: The status to move a booking to.
    UpdateTenantRequest:
      required:
        - name
        - logoUrl
        - theme
      type: object
      properties:
        name:
          maxLength: 200
          type: string
          description: Display name of the tenant.
        logoUrl:
          maxLength: 500
          type:
            - "null"
            - string
          description: Public URL of the tenant's logo, e.g. from the media upload
            endpoint. Null removes it.
        theme:
          description: Colours of the tenant's client site.
          $ref: "#/components/schemas/TenantThemeRequest"
      description: New name, logo and theme of the tenant. The subdomain cannot be changed.
    UpdateTripRequest:
      required:
        - takeoffDate
        - finalRegistrationDate
        - pricePerSeat
        - seats
      type: object
      properties:
        takeoffDate:
          type: string
          description: When the trip departs. Must include a time zone.
          format: date-time
        finalRegistrationDate:
          type: string
          description: When bookings close. Must not be after the takeoff date.
          format: date-time
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat.
          format: double
        seats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Number of seats. Cannot drop below the seats already reserved.
          format: int32
      description: New schedule, price and size of a trip.
