    TenantThemeRequest:
      required:
        - background
        - surface
        - text
        - mutedText
        - border
        - primary
        - onPrimary
        - accent
        - onAccent
        - success
        - danger
      type: object
      properties:
        background:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Page background.
        surface:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Cards and panels on the background.
        text:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Main text.
        mutedText:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Secondary text and labels.
        border:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Borders and dividers.
        primary:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Main buttons, links and prices.
        onPrimary:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Text and icons on primary.
        accent:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Highlights such as status badges.
        onAccent:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Text on accent.
        success:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Success states, e.g. the confirmation check.
        danger:
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
          description: Errors and low-seat warnings.
      description: Colours of a tenant's client site, as hex values such as '#1E40AF'.
    TenantThemeResponse:
      type: object
      properties:
        background:
          type: string
          description: Page background.
        surface:
          type: string
          description: Cards and panels on the background.
        text:
          type: string
          description: Main text.
        mutedText:
          type: string
          description: Secondary text and labels.
        border:
