              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/auth/Verification/verify:
    post:
      tags:
        - Verification
      description: |-
        **Authorization** (all must pass):
        - `LoggedIn`
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfTokenResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfTokenResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfTokenResponse"
        "400":
          description: Code does not match the one issued, or it has expired.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing, invalid or expired access token.
  /api/Analytics/trips:
    get:
      tags:
        - Analytics
      description: |-
        **Authorization** (all must pass):
        - `ViewStatistics`: one of `tenantAdmin`, `admin`, `statisticsViewer`
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfTripCountsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfTripCountsResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfTripCountsResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
  /api/Analytics/earnings:
    get:
      tags:
        - Analytics
      description: |-
        **Authorization** (all must pass):
        - `ViewStatistics`: one of `tenantAdmin`, `admin`, `statisticsViewer`
      parameters:
        - name: From
          in: query
          description: Start of the time frame (inclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
        - name: To
          in: query
          description: End of the time frame (exclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfEarningsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfEarningsResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfEarningsResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
  /api/Analytics/earnings/timeline:
    get:
      tags:
        - Analytics
      description: |-
        **Authorization** (all must pass):
        - `ViewStatistics`: one of `tenantAdmin`, `admin`, `statisticsViewer`
      parameters:
        - name: From
          in: query
          description: Start of the time frame (inclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
        - name: To
          in: query
          description: End of the time frame (exclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
        - name: Interval
          in: query
          description: "Size of each period: Day, Week (starting Monday) or Month."
          schema:
            $ref: "#/components/schemas/EarningsInterval"
        - name: TimeZone
          in: query
          description: IANA time zone the periods are aligned to, e.g. Asia/Baghdad.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfEarningsPeriodResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfEarningsPeriodResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfEarningsPeriodResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
  /api/Analytics/earnings/top-programs:
    get:
      tags:
        - Analytics
      description: |-
        **Authorization** (all must pass):
        - `ViewStatistics`: one of `tenantAdmin`, `admin`, `statisticsViewer`
      parameters:
        - name: From
          in: query
          description: Start of the time frame (inclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
        - name: To
          in: query
          description: End of the time frame (exclusive). Must include a time zone.
          schema:
            type: string
            format: date-time
        - name: Limit
          in: query
          description: Number of programs to return, at most 20.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfProgramEarningsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfProgramEarningsResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfListOfProgramEarningsResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
components:
  schemas:
    AvailableTripDetailsResponse:
      type: object
      properties:
        description:
          type: string
          description: Long-form description of the trip's program.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TripStepResponse"
          description: Itinerary, in order.
        images:
          type: array
          items:
            type: string
          description: Gallery images.
        id:
          type: string
          description: Identifier of the trip. Used to book it.
          format: uuid
        name:
          type: string
          description: Display name of the trip's program.
        coverImage:
          type: string
          description: Cover image of the trip's program.
        transportMethod:
          type: string
          description: How travellers get there.
        totalDays:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Total length of the itinerary in days.
          format: int32
        takeoffDate:
          type: string
          description: When the trip departs.
          format: date-time
        finalRegistrationDate:
          type: string
          description: Last moment to book.
          format: date-time
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat.
          format: double
        availableSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Seats still available to book.
          format: int32
        isInternational:
          type: boolean
          description: Whether the trip goes abroad. Bookings then need passport data for
            every seat.
      description: A trip a customer can book, with its full itinerary.
    AvailableTripResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the trip. Used to book it.
          format: uuid
        name:
          type: string
          description: Display name of the trip's program.
        coverImage:
          type: string
          description: Cover image of the trip's program.
        transportMethod:
          type: string
          description: How travellers get there.
        totalDays:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Total length of the itinerary in days.
          format: int32
        takeoffDate:
          type: string
          description: When the trip departs.
          format: date-time
        finalRegistrationDate:
          type: string
          description: Last moment to book.
          format: date-time
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat.
          format: double
        availableSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Seats still available to book.
          format: int32
        isInternational:
          type: boolean
          description: Whether the trip goes abroad. Bookings then need passport data for
            every seat.
      description: A trip a customer can book.
    AvailableTripsSort:
      type: integer
      description: Order of the available trip listing.
    BookingListItemResponse:
      type: object
      properties:
        tripId:
          type: string
          description: The trip id of this booking.
          format: uuid
        tripName:
          type: string
          description: Display name of the trip's program.
        takeoffDate:
          type: string
          description: When the trip departs.
          format: date-time
        id:
          type: string
          description: Identifier of the booking.
          format: uuid
        customerName:
          type: string
          description: Name of the customer who booked.
        phoneNumber:
          type: string
          description: Phone number of the customer who booked.
        reservedSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Number of seats the booking holds.
          format: int32
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat at the time the booking was made.
          format: double
        totalPrice:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: "Total price of the booking: price per seat times reserved seats."
          format: double
        status:
          description: "Status of the booking: 0 = Pending, 1 = Confirmed, 2 = Cancelled."
          $ref: "#/components/schemas/BookingStatus"
        cancelledAt:
          type:
            - "null"
            - string
          description: When the booking was cancelled, if it was.
          format: date-time
        passports:
          type: array
          items:
            $ref: "#/components/schemas/PassportResponse"
          description: Passport data for each seat. Empty for domestic trips.
        createdAt:
          type: string
          description: When the booking was made.
          format: date-time
      description: A customer's booking, with the trip it is on.
    BookingResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the booking.
          format: uuid
        customerName:
          type: string
          description: Name of the customer who booked.
        phoneNumber:
          type: string
          description: Phone number of the customer who booked.
        reservedSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Number of seats the booking holds.
          format: int32
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat at the time the booking was made.
          format: double
        totalPrice:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: "Total price of the booking: price per seat times reserved seats."
          format: double
        status:
          description: "Status of the booking: 0 = Pending, 1 = Confirmed, 2 = Cancelled."
          $ref: "#/components/schemas/BookingStatus"
        cancelledAt:
          type:
            - "null"
            - string
          description: When the booking was cancelled, if it was.
          format: date-time
        passports:
          type: array
          items:
            $ref: "#/components/schemas/PassportResponse"
          description: Passport data for each seat. Empty for domestic trips.
        createdAt:
          type: string
          description: When the booking was made.
          format: date-time
      description: A customer's booking on a trip.
    BookingStatus:
      type: integer
      description: "Status of the booking: 0 = Pending, 1 = Confirmed, 2 = Cancelled."
    ChangePasswordRequest:
      required:
        - currentPassword
        - newPassword
      type: object
      properties:
        currentPassword:
          type: string
          description: The password currently on the account.
        newPassword:
          minLength: 8
          type: string
          description: The replacement password. Must be at least 8 characters.
      description: Changes the password of the signed in account.
    ClientBookingResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the booking. Quote it when contacting the agency.
          format: uuid
        tripId:
          type: string
          description: Trip the booking is for.
          format: uuid
        reservedSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Number of seats the booking holds.
          format: int32
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat at the time the booking was made.
          format: double
        totalPrice:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Total price of the booking.
          format: double
        status:
          description: "Status of the booking: 0 = Pending, 1 = Confirmed, 2 = Cancelled.
            New bookings are pending until the agency confirms them."
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          description: When the booking was made.
          format: date-time
      description: Confirmation of a booking made by a customer.
    CreateBookingRequest:
      required:
        - customerName
        - phoneNumber
        - seats
      type: object
      properties:
        customerName:
          maxLength: 200
          type: string
          description: Name of the customer booking.
        phoneNumber:
          pattern: ^9647\d{9}$
          type: string
          description: Iraqi phone number of the customer in the format 9647XXXXXXXXX.
        seats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Number of seats to reserve.
          format: int32
        passports:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/PassportRequest"
          description: Passport data for each seat. Required, one per seat, for
            international trips; ignored otherwise.
      description: A customer's booking on a trip.
    CreateEmployeeRequest:
      required:
        - phoneNumber
        - password
        - roles
      type: object
      properties:
        phoneNumber:
          pattern: ^9647\d{9}$
          type: string
          description: Iraqi phone number in the format 9647XXXXXXXXX. Also the employee's
            login.
        password:
          minLength: 8
          type: string
          description: Initial password. Must be at least 8 characters.
        roles:
          type: array
          items:
            type: string
          description: "Roles to grant: admin, tripProgramsManager, tripsManager,
            bookingsViewer, bookingsManager, statisticsViewer."
      description: Account details and roles for a new employee of the caller's tenant.
    CreateTenantRequest:
      required:
        - name
        - subdomain
      type: object
      properties:
        name:
          maxLength: 200
          type: string
          description: Display name of the tenant.
        subdomain:
          maxLength: 63
          minLength: 3
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
          description: Host label the tenant is reached at, e.g. 'acme' for
            acme.tripgate.app.
      description: Details for creating a tenant workspace.
    CreateTripRequest:
      required:
        - tripProgramId
        - takeoffDate
        - finalRegistrationDate
      type: object
      properties:
        tripProgramId:
          type: string
          description: Program the trip is scheduled from.
          format: uuid
        takeoffDate:
          type: string
          description: When the trip departs. Must include a time zone.
          format: date-time
        finalRegistrationDate:
          type: string
          description: When bookings close. Must not be after the takeoff date.
          format: date-time
        pricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - "null"
            - number
            - string
          description: Price per seat. Defaults to the program's price when omitted.
          format: double
        seats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Number of seats. Defaults to the program's seat count when omitted.
          format: int32
      description: A departure to schedule from a trip program.
    EarningsInterval:
      type: integer
    EarningsPeriodResponse:
      required:
        - periodStart
        - earned
        - projected
      type: object
      properties:
        periodStart:
          type: string
          description: Start of the period in the requested time zone.
          format: date-time
        earned:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Confirmed bookings on trips that have already taken off.
          format: double
        projected:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Earned plus confirmed and pending bookings on trips that have not
            taken off yet.
          format: double
      description: Earnings from trips taking off within one period of the timeline.
    EarningsResponse:
      required:
        - from
        - to
        - earned
        - upcomingConfirmed
        - upcomingPending
        - projected
      type: object
      properties:
        from:
          type: string
          description: Start of the time frame (inclusive).
          format: date-time
        to:
          type: string
          description: End of the time frame (exclusive).
          format: date-time
        earned:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Confirmed bookings on trips that have already taken off.
          format: double
        upcomingConfirmed:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Confirmed bookings on trips that have not taken off yet.
          format: double
        upcomingPending:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Pending bookings on trips that have not taken off yet.
          format: double
        projected:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Earned plus upcoming confirmed and pending bookings.
          format: double
      description: Earnings from trips taking off within a time frame.
    EmployeeResponse:
      required:
        - id
        - phoneNumber
        - phoneNumberConfirmed
        - roles
      type: object
      properties:
        id:
          type: string
          description: Identifier of the user.
          format: uuid
        phoneNumber:
          type: string
          description: Iraqi phone number the account is registered under.
        phoneNumberConfirmed:
          type: boolean
          description: Whether the phone number is confirmed.
        roles:
          type: array
          items:
            type: string
          description: Role names held by the user.
      description: A user of the tenant and the roles they hold.
    ForgotPasswordRequest:
      required:
        - phoneNumber
      type: object
      properties:
        phoneNumber:
          pattern: ^9647\d{9}$
          type: string
          description: Iraqi phone number in the format 9647XXXXXXXXX.
      description: Starts the forgot password flow for a phone number.
    IFormFile:
      type: string
      format: binary
    ImageResponse:
      required:
        - key
        - url
      type: object
      properties:
        key:
          type: string
          description: Storage key of the image.
        url:
          type: string
          description: Public URL the image is served from.
      description: An uploaded image.
    LoginRequest:
      required:
        - phoneNumber
        - password
      type: object
      properties:
        phoneNumber:
          pattern: ^9647\d{9}$
          type: string
          description: Iraqi phone number in the format 9647XXXXXXXXX.
        password:
          type: string
          description: Account password.
      description: Credentials for signing in to an existing account.
    PaginatedOfAvailableTripResponse:
      required:
        - data
        - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTripResponse"
        pagination:
          $ref: "#/components/schemas/PaginationData"
        isSuccessful:
          type: boolean
    PaginatedOfBookingListItemResponse:
      required:
        - data
        - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookingListItemResponse"
        pagination:
          $ref: "#/components/schemas/PaginationData"
        isSuccessful:
          type: boolean
    PaginatedOfEmployeeResponse:
      required:
        - data
        - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeResponse"
        pagination:
          $ref: "#/components/schemas/PaginationData"
        isSuccessful:
          type: boolean
    PaginatedOfTripProgramResponse:
      required:
        - data
        - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TripProgramResponse"
        pagination:
          $ref: "#/components/schemas/PaginationData"
        isSuccessful:
          type: boolean
    PaginatedOfTripResponse:
      required:
        - data
        - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TripResponse"
        pagination:
          $ref: "#/components/schemas/PaginationData"
        isSuccessful:
          type: boolean
    PaginationData:
      required:
        - page
        - pageSize
        - totalItems
      type: object
      properties:
        page:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        pageSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        totalItems:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        totalPages:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    PassportRequest:
      required:
        - ownerName
        - number
      type: object
      properties:
        ownerName:
          maxLength: 200
          type: string
          description: Name on the passport.
        number:
          maxLength: 50
          type: string
          description: Passport number.
      description: Passport data of one traveller.
    PassportResponse:
      type: object
      properties:
        ownerName:
          type: string
          description: Name on the passport.
        number:
          type: string
          description: Passport number.
      description: Passport data of one traveller.
    PasswordResetTokenResponse:
      required:
        - token
      type: object
      properties:
        token:
          type: string
          description: Identity password reset token.
      description: Proof of phone number ownership, spent by the reset password step.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
    ProgramEarningsResponse:
      required:
        - tripProgramId
        - name
        - earned
        - projected
        - bookedSeats
      type: object
      properties:
        tripProgramId:
          type: string
          description: Identifier of the program.
          format: uuid
        name:
          type: string
          description: Display name of the program.
        earned:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Confirmed bookings on the program's trips that have already taken
            off.
          format: double
        projected:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Earned plus confirmed and pending bookings on trips that have not
            taken off yet.
          format: double
        bookedSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Seats held by pending and confirmed bookings on the program's trips.
          format: int32
      description: Earnings of one trip program within a time frame.
    RefreshTokenRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          description: The refresh token to act on.
