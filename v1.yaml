        defaultPricePerSeat:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Price per seat used when a trip does not set its own.
          format: double
        defaultSeats:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Seat count used when a trip does not set its own.
          format: int32
        coverImage:
          maxLength: 500
          type: string
          description: Cover image of the program.
        transportMethod:
          maxLength: 100
          type: string
          description: How travellers get there, e.g. 'Bus' or 'Flight'.
        isInternational:
          type: boolean
          description: Whether bookings on this program must carry passport data.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TripStepRequest"
          description: Itinerary of the program. Positions must be unique.
        images:
          maxLength: 500
          type: array
          items:
            type: string
          description: Gallery images of the program.
