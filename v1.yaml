      properties:
        phoneNumber:
          pattern: ^9647\d{9}$
          type: string
          description: Iraqi phone number in the format 9647XXXXXXXXX.
        code:
          pattern: ^\d{6}$
          type: string
          description: Six digit code sent to the phone number.
      description: Exchanges a verification code for a password reset token.
