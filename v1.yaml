            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOfBookingListItemResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/PaginatedOfBookingListItemResponse"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      tags:
        - TripBookings
      description: |-
        **Authorization** (all must pass):
        - `TenantMember`
        - `ManageBookings`: one of `tenantAdmin`, `admin`, `bookingsManager`
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SuccessOfBookingResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOfBookingResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SuccessOfBookingResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing, invalid or expired access token.
        "403":
          description: The caller lacks the required tenant or role.
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The trip is closed for booking, has too few seats left, or changed
            while booking.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
